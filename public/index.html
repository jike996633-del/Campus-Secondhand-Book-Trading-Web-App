<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园二手书交易平台</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- Tailwind配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            accent: '#F59E0B',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .card-hover {
        @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
      }
      .btn-primary {
        @apply bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-all;
      }
      .btn-outline {
        @apply border border-primary text-primary px-4 py-2 rounded-lg hover:bg-primary/10 transition-all;
      }
      .input-field {
        @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary;
      }
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- 导航栏 -->
  <header class="fixed w-full top-0 z-50 bg-white shadow-sm">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#" class="flex items-center space-x-2">
        <i class="fa fa-book text-primary text-2xl"></i>
        <span class="text-xl font-bold text-primary">校园书递</span>
      </a>
      
      <!-- 桌面导航 -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="#" class="font-medium hover:text-primary transition-colors">首页</a>
        <a href="#books" class="font-medium hover:text-primary transition-colors">书籍列表</a>
        <a href="#publish" class="font-medium hover:text-primary transition-colors">发布书籍</a>
      </nav>
      
      <div class="flex items-center space-x-4">
        <button id="loginBtn" class="hidden md:block btn-outline">登录</button>
        <button id="registerBtn" class="hidden md:block btn-primary">注册</button>
        <div id="userMenu" class="hidden items-center space-x-2">
          <span id="userName" class="font-medium"></span>
          <div class="relative group">
            <button class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary">
              <i class="fa fa-user"></i>
            </button>
            <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-10 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
              <a href="#my-books" class="block px-4 py-2 hover:bg-gray-100">我的书籍</a>
              <a href="#" id="logoutBtn" class="block px-4 py-2 hover:bg-gray-100">退出登录</a>
            </div>
          </div>
        </div>
        
        <!-- 移动端菜单按钮 -->
        <button id="mobileMenuBtn" class="md:hidden text-gray-700">
          <i class="fa fa-bars text-xl"></i>
        </button>
      </div>
    </div>
    
    <!-- 移动端导航菜单 -->
    <div id="mobileMenu" class="md:hidden bg-white shadow-md absolute w-full left-0 top-full hidden">
      <div class="container mx-auto px-4 py-3 flex flex-col space-y-4">
        <a href="#" class="py-2 border-b border-gray-100 hover:text-primary">首页</a>
        <a href="#books" class="py-2 border-b border-gray-100 hover:text-primary">书籍列表</a>
        <a href="#publish" class="py-2 border-b border-gray-100 hover:text-primary">发布书籍</a>
        <div class="flex space-x-4 pt-2">
          <button id="mobileLoginBtn" class="flex-1 btn-outline">登录</button>
          <button id="mobileRegisterBtn" class="flex-1 btn-primary">注册</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pt-16">
    <!-- 英雄区 -->
    <section class="bg-gradient-to-r from-primary to-primary/80 text-white py-20">
      <div class="container mx-auto px-4 text-center">
        <h1 class="text-[clamp(2rem,5vw,3.5rem)] font-bold mb-6">校园二手书交易平台</h1>
        <p class="text-xl mb-8 max-w-2xl mx-auto">让闲置书籍流动起来，让知识传递下去</p>
        <div class="flex flex-col sm:flex-row justify-center gap-4">
          <a href="#books" class="bg-white text-primary px-6 py-3 rounded-lg hover:bg-gray-100 transition-all">
            浏览书籍 <i class="fa fa-search ml-2"></i>
          </a>
          <a href="#publish" class="bg-secondary px-6 py-3 rounded-lg hover:bg-secondary/90 transition-all">
            发布书籍 <i class="fa fa-plus ml-2"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- 书籍列表区 -->
    <section id="books" class="py-16 bg-gray-50">
      <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-12">二手书籍列表</h2>

        <!-- 分类筛选 -->
        <div class="mb-8 flex flex-wrap gap-2 justify-center">
          <button class="category-btn px-4 py-2 rounded-full bg-primary text-white" data-category="all">全部</button>
          <button class="category-btn px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300" data-category="教材">教材</button>
          <button class="category-btn px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300" data-category="小说">小说</button>
          <button class="category-btn px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300" data-category="工具书">工具书</button>
          <button class="category-btn px-4 py-2 rounded-full bg-gray-200 hover:bg-gray-300" data-category="其他">其他</button>
        </div>

        <!-- 搜索框 -->
        <div class="mb-8 max-w-md mx-auto">
          <div class="relative">
            <input type="text" id="searchInput" placeholder="搜索书籍名称或作者..." class="input-field pl-10">
            <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          </div>
        </div>

        <!-- 书籍网格 -->
        <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- 书籍卡片将动态生成 -->
          <div class="col-span-full text-center py-12">
            <i class="fa fa-book text-gray-300 text-5xl mb-4"></i>
            <p class="text-gray-500">加载书籍中...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 发布书籍区 -->
    <section id="publish" class="py-16 bg-white">
      <div class="container mx-auto px-4 max-w-2xl">
        <h2 class="text-3xl font-bold text-center mb-12">发布二手书籍</h2>

        <form id="publishForm" class="bg-gray-50 p-6 rounded-xl shadow-sm">
          <div class="mb-5">
            <label for="title" class="block text-gray-700 mb-2">书籍标题 <span class="text-red-500">*</span></label>
            <input type="text" id="title" class="input-field" placeholder="例如：高等数学（第七版）" required>
          </div>

          <div class="mb-5">
            <label for="author" class="block text-gray-700 mb-2">作者 <span class="text-red-500">*</span></label>
            <input type="text" id="author" class="input-field" placeholder="例如：同济大学数学系" required>
          </div>

          <div class="mb-5">
            <label for="category" class="block text-gray-700 mb-2">分类 <span class="text-red-500">*</span></label>
            <select id="category" class="input-field" required>
              <option value="">请选择分类</option>
              <option value="教材">教材</option>
              <option value="小说">小说</option>
              <option value="工具书">工具书</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="mb-5">
            <label for="price" class="block text-gray-700 mb-2">价格 (元) <span class="text-red-500">*</span></label>
            <input type="number" id="price" class="input-field" placeholder="例如：30" min="0" step="0.01" required>
          </div>

          <div class="mb-5">
            <label for="condition" class="block text-gray-700 mb-2">新旧程度 <span class="text-red-500">*</span></label>
            <select id="condition" class="input-field" required>
              <option value="">请选择新旧程度</option>
              <option value="全新">全新</option>
              <option value="九成新">九成新</option>
              <option value="八成新">八成新</option>
              <option value="七成新">七成新</option>
              <option value="六成新及以下">六成新及以下</option>
            </select>
          </div>

          <div class="mb-6">
            <label for="contact" class="block text-gray-700 mb-2">联系方式 <span class="text-red-500">*</span></label>
            <input type="text" id="contact" class="input-field" placeholder="例如：微信：wx123456" required>
          </div>

          <button type="submit" class="btn-primary w-full py-3 text-lg">
            发布书籍 <i class="fa fa-paper-plane ml-2"></i>
          </button>
        </form>
      </div>
    </section>

    <!-- 我的书籍区 -->
    <section id="my-books" class="py-16 bg-gray-50 hidden">
      <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-12">我的书籍</h2>
        <div id="myBooksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- 我的书籍卡片将动态生成 -->
          <div class="col-span-full text-center py-12">
            <i class="fa fa-book text-gray-300 text-5xl mb-4"></i>
            <p class="text-gray-500">请先登录查看你的书籍</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="bg-gray-800 text-white py-10">
    <div class="container mx-auto px-4 text-center">
      <p>© 2025 校园二手书交易平台 - 让每本书都物尽其用</p>
    </div>
  </footer>

  <!-- 登录模态框 -->
  <div id="loginModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 p-6 transform transition-all">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold">用户登录</h3>
        <button id="closeLoginModal" class="text-gray-400 hover:text-gray-600">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <form id="loginForm">
        <div class="mb-5">
          <label for="loginStudentId" class="block text-gray-700 mb-2">学号</label>
          <input type="text" id="loginStudentId" class="input-field" placeholder="请输入学号" required>
        </div>
        
        <div class="mb-6">
          <label for="loginPassword" class="block text-gray-700 mb-2">密码</label>
          <input type="password" id="loginPassword" class="input-field" placeholder="请输入密码" required>
        </div>
        
        <button type="submit" class="btn-primary w-full py-3">
          登录 <i class="fa fa-sign-in ml-2"></i>
        </button>
        
        <div class="mt-4 text-center">
          <span class="text-gray-600">还没有账号？</span>
          <button type="button" id="switchToRegister" class="text-primary hover:underline ml-1">立即注册</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 注册模态框 -->
  <div id="registerModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 p-6 transform transition-all">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold">用户注册</h3>
        <button id="closeRegisterModal" class="text-gray-400 hover:text-gray-600">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <form id="registerForm">
        <div class="mb-5">
          <label for="registerStudentId" class="block text-gray-700 mb-2">学号 <span class="text-red-500">*</span></label>
          <input type="text" id="registerStudentId" class="input-field" placeholder="请输入学号" required>
        </div>
        
        <div class="mb-5">
          <label for="registerName" class="block text-gray-700 mb-2">姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="registerName" class="input-field" placeholder="请输入姓名" required>
        </div>
        
        <div class="mb-6">
          <label for="registerPassword" class="block text-gray-700 mb-2">密码 <span class="text-red-500">*</span></label>
          <input type="password" id="registerPassword" class="input-field" placeholder="请设置密码" required>
        </div>
        
        <button type="submit" class="btn-primary w-full py-3">
          注册 <i class="fa fa-user-plus ml-2"></i>
        </button>
        
        <div class="mt-4 text-center">
          <span class="text-gray-600">已有账号？</span>
          <button type="button" id="switchToLogin" class="text-primary hover:underline ml-1">立即登录</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 通知提示 -->
  <div id="notification" class="fixed top-20 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 z-50 flex items-center">
    <i id="notificationIcon" class="fa mr-2"></i>
    <span id="notificationMessage"></span>
  </div>

  <script>
    // 状态管理
    const state = {
      token: localStorage.getItem('token'),
      user: JSON.parse(localStorage.getItem('user')),
      books: [],
      currentCategory: 'all',
      searchQuery: ''
    };

    // DOM元素
    const elements = {
      // 导航相关
      loginBtn: document.getElementById('loginBtn'),
      registerBtn: document.getElementById('registerBtn'),
      mobileLoginBtn: document.getElementById('mobileLoginBtn'),
      mobileRegisterBtn: document.getElementById('mobileRegisterBtn'),
      userMenu: document.getElementById('userMenu'),
      userName: document.getElementById('userName'),
      logoutBtn: document.getElementById('logoutBtn'),
      mobileMenuBtn: document.getElementById('mobileMenuBtn'),
      mobileMenu: document.getElementById('mobileMenu'),
      
      // 模态框相关
      loginModal: document.getElementById('loginModal'),
      registerModal: document.getElementById('registerModal'),
      closeLoginModal: document.getElementById('closeLoginModal'),
      closeRegisterModal: document.getElementById('closeRegisterModal'),
      switchToRegister: document.getElementById('switchToRegister'),
      switchToLogin: document.getElementById('switchToLogin'),
      loginForm: document.getElementById('loginForm'),
      registerForm: document.getElementById('registerForm'),
      
      // 书籍相关
      booksGrid: document.getElementById('booksGrid'),
      myBooksGrid: document.getElementById('myBooksGrid'),
      publishForm: document.getElementById('publishForm'),
      categoryBtns: document.querySelectorAll('.category-btn'),
      searchInput: document.getElementById('searchInput'),
      
      // 通知相关
      notification: document.getElementById('notification'),
      notificationIcon: document.getElementById('notificationIcon'),
      notificationMessage: document.getElementById('notificationMessage')
    };

    // 显示通知
    function showNotification(message, isError = false) {
      elements.notificationMessage.textContent = message;
      elements.notificationIcon.className = `fa mr-2 ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}`;
      elements.notification.classList.remove('translate-x-full');
      
      setTimeout(() => {
        elements.notification.classList.add('translate-x-full');
      }, 3000);
    }

    // 显示模态框
    function showModal(modal) {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.querySelector('div').classList.add('scale-100');
        modal.querySelector('div').classList.remove('scale-95');
      }, 10);
    }

    // 隐藏模态框（核心修复：确保能关闭）
    function hideModal(modal) {
      modal.querySelector('div').classList.remove('scale-100');
      modal.querySelector('div').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // 检查登录状态
    function isLoggedIn() {
      return !!state.token;
    }

    // 更新登录状态UI
    function updateAuthUI() {
      if (isLoggedIn()) {
        // 已登录状态
        elements.loginBtn.classList.add('hidden');
        elements.registerBtn.classList.add('hidden');
        elements.mobileLoginBtn.classList.add('hidden');
        elements.mobileRegisterBtn.classList.add('hidden');
        elements.userMenu.classList.remove('hidden');
        elements.userMenu.classList.add('flex');
        elements.userName.textContent = state.user?.name || '用户';
        document.getElementById('my-books').classList.remove('hidden');
        loadMyBooks();
      } else {
        // 未登录状态
        elements.loginBtn.classList.remove('hidden');
        elements.registerBtn.classList.remove('hidden');
        elements.mobileLoginBtn.classList.remove('hidden');
        elements.mobileRegisterBtn.classList.remove('hidden');
        elements.userMenu.classList.add('hidden');
        elements.userMenu.classList.remove('flex');
        document.getElementById('my-books').classList.add('hidden');
      }
    }

    // 生成书籍卡片HTML
    function generateBookCard(book, isMyBook = false) {
      return `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden card-hover">
          <div class="h-48 bg-primary/10 flex items-center justify-center">
            <i class="fa fa-book text-primary text-6xl"></i>
          </div>
          <div class="p-5">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg">${book.title}</h3>
              <span class="text-primary font-bold">¥${book.price}</span>
            </div>
            <p class="text-gray-600 text-sm mb-3">作者：${book.author}</p>
            <div class="flex flex-wrap gap-2 mb-4">
              <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">${book.category}</span>
              <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">${book.condition}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-sm text-gray-500">发布者：${book.userName}</span>
              ${isMyBook ? 
                `<button class="delete-book-btn text-red-500 hover:text-red-600 text-sm" data-id="${book.id}">
                  <i class="fa fa-trash mr-1"></i> 删除
                </button>` : ''
              }
            </div>
          </div>
        </div>
      `;
    }

    // 登录功能
    async function login(studentId, password) {
      try {
        const response = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || '登录失败');
        }
        
        return data;
      } catch (error) {
        showNotification(error.message, true);
        return null;
      }
    }

    // 注册功能（核心修复：完善注册）
    async function register(studentId, name, password) {
      try {
        const response = await fetch('/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, name, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || '注册失败');
        }
        
        return data;
      } catch (error) {
        showNotification(error.message, true);
        return null;
      }
    }

    // 获取书籍列表（核心修复：分类筛选）
    async function loadBooks() {
      try {
        let url = `/api/books?category=${state.currentCategory}`;
        if (state.searchQuery) url += `&search=${state.searchQuery}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || '加载书籍失败');
        }
        
        state.books = data.books;
        
        if (state.books.length === 0) {
          elements.booksGrid.innerHTML = `
            <div class="col-span-full text-center py-12">
              <i class="fa fa-search text-gray-300 text-5xl mb-4"></i>
              <p class="text-gray-500">未找到匹配的书籍</p>
            </div>
          `;
          return;
        }
        
        elements.booksGrid.innerHTML = '';
        state.books.forEach(book => {
          elements.booksGrid.innerHTML += generateBookCard(book);
        });
      } catch (error) {
        elements.booksGrid.innerHTML = `
          <div class="col-span-full text-center py-12">
            <i class="fa fa-exclamation-triangle text-yellow-500 text-5xl mb-4"></i>
            <p class="text-gray-500">${error.message}</p>
          </div>
        `;
      }
    }

    // 获取我的书籍
    async function loadMyBooks() {
      if (!isLoggedIn()) return;
      
      try {
        const response = await fetch('/api/books/my', {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || '加载我的书籍失败');
        }
        
        if (data.books.length === 0) {
          elements.myBooksGrid.innerHTML = `
            <div class="col-span-full text-center py-12">
              <i class="fa fa-book text-gray-300 text-5xl mb-4"></i>
              <p class="text-gray-500">你还没有发布任何书籍</p>
              <a href="#publish" class="inline-block mt-4 btn-primary">
                立即发布 <i class="fa fa-plus ml-1"></i>
              </a>
            </div>
          `;
          return;
        }
        
        elements.myBooksGrid.innerHTML = '';
        data.books.forEach(book => {
          elements.myBooksGrid.innerHTML += generateBookCard(book, true);
        });
        
        // 绑定删除事件
        document.querySelectorAll('.delete-book-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm('确定要删除这本书吗？')) {
              await deleteBook(btn.getAttribute('data-id'));
              loadMyBooks();
              loadBooks();
            }
          });
        });
      } catch (error) {
        elements.myBooksGrid.innerHTML = `
          <div class="col-span-full text-center py-12">
            <i class="fa fa-exclamation-triangle text-yellow-500 text-5xl mb-4"></i>
            <p class="text-gray-500">${error.message}</p>
          </div>
        `;
      }
    }

    // 发布书籍（核心修复：确保发布后显示）
    async function publishBook(bookData) {
      if (!isLoggedIn()) {
        showNotification('请先登录', true);
        showModal(elements.loginModal);
        return null;
      }
      
      try {
        const response = await fetch('/api/books', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.token}`
          },
          body: JSON.stringify(bookData)
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || '发布书籍失败');
        }
        
        return data;
      } catch (error) {
        showNotification(error.message, true);
        return null;
      }
    }

    // 删除书籍
    async function deleteBook(bookId) {
      try {
        const response = await fetch(`/api/books/${bookId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.message || '删除失败');
        }
        
        showNotification('书籍已删除');
        return true;
      } catch (error) {
        showNotification(error.message, true);
        return false;
      }
    }

    // 事件监听 - 登录表单提交
    elements.loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const studentId = document.getElementById('loginStudentId').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      
      if (!studentId || !password) {
        showNotification('请填写完整信息', true);
        return;
      }
      
      const result = await login(studentId, password);
      
      if (result && result.success) {
        state.token = result.token;
        state.user = result.user;
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        
        updateAuthUI();
        hideModal(elements.loginModal); // 核心修复：关闭登录模态框
        showNotification('登录成功');
        elements.loginForm.reset();
        loadBooks(); // 刷新书籍列表
      }
    });

    // 事件监听 - 注册表单提交
    elements.registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const studentId = document.getElementById('registerStudentId').value.trim();
      const name = document.getElementById('registerName').value.trim();
      const password = document.getElementById('registerPassword').value.trim();
      
      if (!studentId || !name || !password) {
        showNotification('请填写完整信息', true);
        return;
      }
      
      const result = await register(studentId, name, password);
      
      if (result && result.success) {
        state.token = result.token;
        state.user = result.user;
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        
        updateAuthUI();
        hideModal(elements.registerModal);
        showNotification('注册成功');
        elements.registerForm.reset();
        loadBooks(); // 刷新书籍列表
      }
    });

    // 事件监听 - 发布书籍表单提交
    elements.publishForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const bookData = {
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        condition: document.getElementById('condition').value,
        contact: document.getElementById('contact').value.trim()
      };
      
      if (!bookData.title || !bookData.author || !bookData.category || !bookData.price || !bookData.condition || !bookData.contact) {
        showNotification('请填写完整信息', true);
        return;
      }
      
      const result = await publishBook(bookData);
      
      if (result && result.success) {
        showNotification('书籍发布成功！');
        elements.publishForm.reset();
        loadBooks(); // 核心修复：发布后刷新列表
        loadMyBooks(); // 刷新我的书籍
      }
    });

    // 事件监听 - 分类筛选（核心修复：分类功能）
    elements.categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // 更新按钮样式
        elements.categoryBtns.forEach(b => {
          b.classList.remove('bg-primary', 'text-white');
          b.classList.add('bg-gray-200', 'hover:bg-gray-300');
        });
        btn.classList.remove('bg-gray-200', 'hover:bg-gray-300');
        btn.classList.add('bg-primary', 'text-white');
        
        // 更新分类并重新加载
        state.currentCategory = btn.getAttribute('data-category');
        loadBooks();
      });
    });

    // 事件监听 - 搜索
    elements.searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value.trim();
      loadBooks();
    });

    // 事件监听 - 登出
    elements.logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      state.token = null;
      state.user = null;
      updateAuthUI();
      showNotification('已退出登录');
      loadBooks();
    });

    // 事件监听 - 模态框控制
    elements.loginBtn.addEventListener('click', () => showModal(elements.loginModal));
    elements.registerBtn.addEventListener('click', () => showModal(elements.registerModal));
    elements.mobileLoginBtn.addEventListener('click', () => showModal(elements.loginModal));
    elements.mobileRegisterBtn.addEventListener('click', () => showModal(elements.registerModal));
    elements.closeLoginModal.addEventListener('click', () => hideModal(elements.loginModal)); // 核心修复：关闭按钮
    elements.closeRegisterModal.addEventListener('click', () => hideModal(elements.registerModal));
    elements.switchToRegister.addEventListener('click', () => {
      hideModal(elements.loginModal);
      setTimeout(() => showModal(elements.registerModal), 300);
    });
    elements.switchToLogin.addEventListener('click', () => {
      hideModal(elements.registerModal);
      setTimeout(() => showModal(elements.loginModal), 300);
    });

    // 事件监听 - 移动端菜单
    elements.mobileMenuBtn.addEventListener('click', () => {
      elements.mobileMenu.classList.toggle('hidden');
    });

    // 页面加载初始化
    document.addEventListener('DOMContentLoaded', () => {
      updateAuthUI();
      loadBooks();
      
      // 平滑滚动
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            window.scrollTo({
              top: target.offsetTop - 80,
              behavior: 'smooth'
            });
          }
        });
      });
    });
  </script>
</body>
</html>
